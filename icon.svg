<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" role="img" aria-label="STW heel correction">
  <rect width="64" height="64" rx="10" fill="#0d1117"/>
  <!-- waterline -->
  <line x1="5" y1="38" x2="59" y2="38" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 4"/>
  <!-- upright reference -->
  <line x1="26" y1="38" x2="26" y2="11" stroke="#30363d" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
  <!-- mast, heeled -->
  <line x1="26" y1="38" x2="43" y2="12" stroke="#e6edf3" stroke-width="3.5" stroke-linecap="round"/>
  <!-- hull -->
  <path d="M17.5 32.5 Q 26 51 34.5 43.5" fill="none" stroke="#e6edf3" stroke-width="3.5" stroke-linecap="round"/>
  <!-- heel angle -->
  <path d="M26 24 A 14 14 0 0 1 33.6 26.3" fill="none" stroke="#f0b429" stroke-width="3" stroke-linecap="round"/>
  <!-- corrected speed through water -->
  <path d="M13 55 H43" stroke="#4cd97b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M37 49.5 l6 5.5 -6 5.5" fill="none" stroke="#4cd97b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
